version = 1
SPDX-PackageName = "kannadi"
SPDX-PackageDownloadLocation = "https://github.com/openkannada/kannadi"

# Code, glyph tables, tests and tool configuration.
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 The Open Kannada Authors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# Docs we write.
[[annotations]]
path = ["**/*.md", "docs/newspaper-fonts.tsv"]
SPDX-FileCopyrightText = "2026 The Open Kannada Authors"
SPDX-License-Identifier = "CC-BY-4.0"

# Test results and the dashboard built from them. Font names and copyright strings
# quoted from the fonts belong to their owners.
[[annotations]]
path = ["tools/fontqa/results/**"]
SPDX-FileCopyrightText = "2026 The Open Kannada Authors"
SPDX-License-Identifier = "CC-BY-4.0"

# Logo, screenshots and page images. The names and logo are also covered by TRADEMARKS.md.
[[annotations]]
path = ["docs/images/**", "web/src/og/**", "web/src/favicon.svg"]
SPDX-FileCopyrightText = "2026 The Open Kannada Authors"
SPDX-License-Identifier = "CC-BY-4.0"

# Editor screenshots: our page, showing lines of a 2002 Karnataka government web page.
[[annotations]]
path = "docs/images/editor*.png"
SPDX-FileCopyrightText = ["2026 The Open Kannada Authors", "Government of Karnataka"]
SPDX-License-Identifier = "CC-BY-4.0 AND LicenseRef-Excerpts"

[[annotations]]
path = "web/src/fonts/**"
SPDX-FileCopyrightText = "2022 The Noto Project Authors (https://github.com/notofonts/kannada)"
SPDX-License-Identifier = "OFL-1.1"

# Short excerpts of Karnataka government documents, kept for testing with their sources.
[[annotations]]
path = [
  "corpus/nudi-2002.tsv",
  "crates/kannadi/tests/fixtures/nudi.tsv",
  "crates/kannadi/tests/fixtures/akruti.tsv",
  "crates/kannadi/tests/fixtures/nudi-b.tsv",
  "crates/kannadi/tests/fixtures/kan-eng.tsv",
]
SPDX-FileCopyrightText = "Government of Karnataka"
SPDX-License-Identifier = "LicenseRef-Excerpts"

# PDFs printed by Chrome from text written for kannadi, set in the Noto fonts in
# web/src/fonts, whose glyphs they embed.
[[annotations]]
path = "crates/kannadi-cli/tests/fixtures/unicode-*.pdf"
SPDX-FileCopyrightText = ["2026 The Open Kannada Authors", "2022 The Noto Project Authors (https://github.com/notofonts/kannada)"]
SPDX-License-Identifier = "(MIT OR Apache-2.0) AND OFL-1.1"

# Word and RTF files built from lines of the glyph fixtures above, and the text expected from them.
[[annotations]]
path = ["crates/kannadi-cli/tests/fixtures/legacy.*"]
SPDX-FileCopyrightText = ["2026 The Open Kannada Authors", "Government of Karnataka"]
SPDX-License-Identifier = "(MIT OR Apache-2.0) AND LicenseRef-Excerpts"

# The typing model, trained on Aksharantar (CC0 and CC BY 4.0), Dakshina (CC BY-SA 4.0)
# and Kannada Wikipedia word counts (CC BY-SA 4.0).
[[annotations]]
path = "crates/kannadi-typing/model/kn.typing"
SPDX-FileCopyrightText = ["2026 The Open Kannada Authors", "AI4Bharat", "Google LLC", "Kannada Wikipedia contributors"]
SPDX-License-Identifier = "CC-BY-SA-4.0"

# The Dakshina Kannada dev and test lexicons, unchanged.
[[annotations]]
path = "crates/kannadi-typing/eval/dakshina-kn-*.tsv"
SPDX-FileCopyrightText = "Google LLC"
SPDX-License-Identifier = "CC-BY-SA-4.0"
