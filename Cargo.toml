[workspace]
resolver = "2"
members = ["crates/kannadi", "crates/kannadi-cli", "crates/kannadi-typing", "crates/kannadi-typing-wasm", "crates/kannadi-wasm"]
# The Python bindings, built by maturin with their own lock file.
exclude = ["crates/kannadi-py"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/openkannada/kannadi"
authors = ["The Open Kannada Authors"]

# Used by web/build.sh for the converter page.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
