[workspace]
resolver = "2"
members = ["crates/kannadi", "crates/kannadi-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/prasadus92/kannadi"
authors = ["Prasad Subrahmanya <prasadus92@gmail.com>"]

# Used by web/build.sh for the converter page.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
