[workspace]
resolver = "2"
members = ["crates/kannadi", "crates/kannadi-cli", "crates/kannadi-wasm"]

[workspace.package]
version = "0.1.0-rc.1"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/openkannada/kannadi"
authors = ["The Open Kannada Authors"]

# Used by web/build.sh for the converter page.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
