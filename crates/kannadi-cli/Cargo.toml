[package]
name = "kannadi-cli"
description = "Convert Kannada documents (TXT, HTML, DOCX, DOC, RTF, PDF) typed in Nudi, Baraha ANSI, Nudi B-Akshara, Kan-Eng, Akruti and Shree-Lipi fonts to Unicode, and Unicode to Nudi; type Kannada in English letters"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version = "1.89"
readme = "README.md"
keywords = ["kannada", "nudi", "unicode", "converter", "cli"]
categories = ["command-line-utilities", "text-processing", "internationalization"]
include = ["src/**/*.rs", "assets/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[[bin]]
name = "kannadi"
path = "src/main.rs"
# The library crate is also named kannadi; documenting both would collide.
doc = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
clap_complete = "4.6.12"
clap_mangen = "0.3.4"
quick-xml = "0.42.0"
kannadi = { path = "../kannadi", version = "0.1.0" }
kannadi-typing = { path = "../kannadi-typing", version = "0.1.0" }
lopdf = { version = "0.47.0", default-features = false }
zip = { version = "9.6.0", default-features = false, features = ["deflate"] }
cfb = "0.16.0"

[dev-dependencies]
proptest = "1.12"
tempfile = "3.27.0"

[package.metadata.dist]
# Shipped in every archive next to the binary.
include = ["assets/man/", "assets/completions/"]
