[package]
name = "kannadi-cli"
description = "Batch converter for Kannada documents typed in Nudi and Baraha ANSI fonts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
rust-version = "1.85"

[[bin]]
name = "kannadi"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
kannadi = { path = "../kannadi" }

[dev-dependencies]
tempfile = "3.27.0"
