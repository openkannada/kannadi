[package]
name = "kannadi-cli"
description = "Batch converter for Kannada documents typed in Nudi and Baraha ANSI fonts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
rust-version = "1.88"

[[bin]]
name = "kannadi"
path = "src/main.rs"
# The library crate is also named kannadi; documenting both would collide.
doc = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
quick-xml = "0.42.0"
kannadi = { path = "../kannadi" }
lopdf = { version = "0.47.0", default-features = false }
zip = { version = "9.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
proptest = "1.12"
tempfile = "3.27.0"
