[package]
name = "kannadi-typing-wasm"
description = "WebAssembly bindings for kannadi-typing, used by the editor's English-letters mode"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kannadi-typing = { path = "../kannadi-typing", default-features = false }
wasm-bindgen = "0.2.130"
