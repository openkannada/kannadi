[package]
name = "kannadi"
description = "Convert Kannada text in legacy Nudi, Baraha and Akruti fonts to Unicode and back; akshara segmentation, normalization, transliteration and numerals"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["kannada", "nudi", "unicode", "transliteration", "indic"]
exclude = ["tests/", "examples/corpus.rs"]
categories = ["text-processing", "internationalization"]

[dependencies]
unicode-normalization = "0.1.26"

[dev-dependencies]
proptest = "1.12"
unicode-normalization = "0.1.26"
vidyut-lipi = "0.2.0"
