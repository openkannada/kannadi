[package]
name = "kannadi-py"
description = "Python bindings for kannadi, built with maturin"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/openkannada/kannadi"
authors = ["The Open Kannada Authors"]
publish = false

# Outside the main workspace, so the workspace builds and tests need no Python.
[workspace]

[lib]
name = "kannadi_py"
crate-type = ["cdylib"]

[dependencies]
kannadi = { path = "../kannadi" }
pyo3 = { version = "0.30.1", features = ["abi3-py310"] }
