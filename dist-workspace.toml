[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Writes the Homebrew formula, with man pages and completions, to openkannada/homebrew-tap
publish-jobs = ["./publish-homebrew"]
# The publish job reads the release's checksums
github-custom-job-permissions = { "publish-homebrew" = { contents = "read" } }
# release.yml has 1 hand edit: dist 0.34.0 writes `uses: $/.github/...` for local
# publish jobs, which GitHub rejects; the line must read `uses: ./.github/...`
allow-dirty = ["ci"]
# Build every artifact on pull requests too, as a dry run
pr-run-mode = "upload"
