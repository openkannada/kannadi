[project]
name = "fontqa"
version = "0.1.0"
description = "Shaping and rendering tests for Kannada fonts"
license = "MIT OR Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "fonttools[unicode]==4.68.0",
    "uharfbuzz==0.57.0",
    "freetype-py==2.5.1",
    "pillow==13.0.0",
    "skia-pathops==0.9.2",
]

[project.scripts]
fontqa = "fontqa.cli:main"

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fontqa"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
