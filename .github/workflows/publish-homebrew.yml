# Writes Formula/kannadi.rb to the openkannada/homebrew-tap repository for a release.
# dist's release workflow calls it after the GitHub Release is created. It needs a
# HOMEBREW_TAP_TOKEN secret that can push to the tap.
name: Publish Homebrew formula

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  formula:
    if: ${{ !fromJson(inputs.plan).announcement_is_prerelease }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ fromJson(inputs.plan).announcement_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Fetch the release checksums
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern sha256.sum --dir release
      - name: Write the formula
        run: python3 .github/scripts/homebrew_formula.py "${TAG#v}" release/sha256.sum > kannadi.rb
      - uses: actions/checkout@v6
        with:
          repository: openkannada/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Commit the formula to the tap
        run: |
          mkdir -p tap/Formula
          cp kannadi.rb tap/Formula/kannadi.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/kannadi.rb
          git commit -m "kannadi ${TAG#v}"
          git push
