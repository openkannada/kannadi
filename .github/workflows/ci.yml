name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: .github/scripts/dco.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uvx reuse@6.3.0 lint

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked
      - run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  property-tests-long:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --locked --test props --test differential
        env:
          PROPTEST_CASES: "50000"

  homebrew-formula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Write the formula from sample checksums and check it
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-musl x86_64-unknown-linux-musl; do
            echo "$(printf '%064d' 0) *kannadi-cli-$t.tar.xz"
          done > sums
          python3 .github/scripts/homebrew_formula.py 9.9.9 sums > kannadi.rb
          ruby -c kannadi.rb
          grep -q 'releases/download/v9.9.9/kannadi-cli-x86_64-unknown-linux-musl.tar.xz' kannadi.rb
          grep -q 'man1.install' kannadi.rb
          head -n 3 sums > partial
          if python3 .github/scripts/homebrew_formula.py 9.9.9 partial; then exit 1; fi

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.75
      - run: cargo check -p kannadi --lib --locked
      - uses: dtolnay/rust-toolchain@1.89
      - run: cargo +1.89 check -p kannadi-cli --locked

  wasm-and-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p kannadi-wasm --locked --target wasm32-unknown-unknown
      - id: wasm-bindgen
        run: echo "version=$(web/wasm-bindgen-version.sh)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: web/build.sh
      - run: node web/test/smoke.mjs
      - run: node --test web/test/units.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: converter-page
          path: web/dist
          retention-days: 14

  python-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/kannadi-py
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/kannadi-py
      - uses: astral-sh/setup-uv@v10.3.3
      - name: The bindings have the workspace version
        run: test "$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)" = "$(awk -F'"' '/^version = / { print $2; exit }' ../../Cargo.toml)"
      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings
      - run: uvx maturin@1.16.0 build --release --locked --out dist
      - run: uv run --no-project --python 3.12 --with pytest==9.2.0 --with dist/*.whl pytest -q tests

  npm-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - id: wasm-bindgen
        run: echo "version=$(web/wasm-bindgen-version.sh)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: crates/kannadi-wasm/npm/build.sh
      - run: KANNADI_TGZ=target/npm/kannadi-$(node -p "require('./crates/kannadi-wasm/npm/package.json').version").tgz node --test crates/kannadi-wasm/npm/test/node.test.mjs

  fontqa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/fontqa
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check . ../glyphdraft
      - run: uv run ruff format --check . ../glyphdraft
      - run: uv run pytest -q

  glyphdraft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fontforge
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
        working-directory: tools/fontqa
      - name: Draft into a synthetic font and gate the result
        run: |
          set -eo pipefail
          out="$RUNNER_TEMP/draft"
          mkdir -p "$out"
          fontforge -lang=py -script tools/glyphdraft/make_test_font.py "$out/t.sfd" "$out/t.ttf"
          (cd tools/fontqa && uv run fontqa measure "$out/t.ttf") > "$out/measure.json"
          fontforge -lang=py -script tools/glyphdraft/draft.py "$out/t.sfd" "$out/measure.json" 2>&1 | tee "$out/draft.log"
          if grep -q "Internal Error" "$out/draft.log"; then exit 1; fi
          fontforge -lang=py -c 'import fontforge, sys; fontforge.open(sys.argv[1]).generate(sys.argv[2])' "$out/t.sfd" "$out/drafted.ttf"
          cd tools/fontqa && uv run fontqa gate "$out/drafted.ttf"
